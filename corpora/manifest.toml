# Corpus manifest.
#
# Every artifact CLAVE consumes is described here by name, source and expected
# digest. No corpus binary is committed to this repository; this file is what
# makes two runs comparable, because it records which bytes each one saw.
#
# An entry without a sha256 is UNVERIFIED. The platform refuses to report an
# unverified artifact as available. An operator fetches it, runs
# `clave record-digest <name> <path>`, reviews the digest, and commits it here.
#
# Corpora below were shortlisted in the review that screened them for license,

[[artifact]]
name = "smoke"
source = "corpora/fixtures/smoke.csv"
sha256 = "49456cc7821dde7dfb206138fb51532c65b3edd2e15d53498793aee3c1d66c4b"

[[artifact]]
name = "spectralwaste"
source = "https://zenodo.org/records/10666470"
# Unverified: not fetched. CC BY 4.0, operating sorting line, RGB and
# hyperspectral. Advanced at v0.1.0.

[[artifact]]
name = "taco"
source = "http://tacodataset.org/"
# Unverified: not fetched. CC BY 4.0, outdoor litter, 60 categories.
# Advanced at v0.1.0; its label mapping is 26 of 60 complete at v0.2.0.

[[artifact]]
name = "trashnet"
source = "https://raw.githubusercontent.com/garythung/trashnet/master/data/dataset-resized.zip"
# Verified. MIT, 42834870 bytes, 2527 images under six whole-image labels, no
# localization. Advanced at v0.1.0 as a baseline. Fetched and digested on
# 2026-09-14 through `clave record-digest`; what the bytes hold is measured in
# the ingestion notes. The archive itself is never committed: it
# belongs under datasets/, which is gitignored.
sha256 = "0bf472790f8b20e5c950d5b5012a9d38af0d3392efd65f8ce171334fc16b07c2"

[[artifact]]
name = "zerowaste"
source = "https://zenodo.org/records/6412647/files/zerowaste-f-final.zip"
# Verified. 7518242799 bytes, 4503 images under COCO annotations carrying 26766
# boxed regions across four material labels, on an operating recovery-facility
# conveyor. Ranked first at v0.1.0. Fetched and digested on 2026-09-14 through
# `clave record-digest`; the md5 Zenodo publishes for the same file,
# e26e31a58080bca6782dca0e56074c5d, was checked against the bytes as well, so
# the artifact is tied to its source by the publisher's own digest and not only
# by ours. What the bytes hold is measured in
# the ingestion notes. The archive is never committed: it belongs
# under datasets/, which is gitignored.
#
# The license is recorded in two places and they disagree. The Zenodo record
# states CC BY 4.0; the project page at ai.bu.edu/zerowaste states CC BY-NC
# 4.0. CLAVE is personal research, which satisfies the stricter of the two, so
# nothing here depends on resolving it, and the narrower term is the one
# the corpus shortlist carries.
sha256 = "9ce00fe12e0e4163d94f83e167e7d358211702d58fd6b82b9b9021615a80f117"
