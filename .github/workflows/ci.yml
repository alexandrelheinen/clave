name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust (stable)
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo tools
        if: hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny

      - name: Set up Python
        if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python toolchain
        if: hashFiles('pyproject.toml') != ''
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          # The world extra brings MuJoCo and PyYAML so the sorting world is
          # genuinely exercised here rather than skipped. The candidate extra is
          # deliberately not installed: it is over a gigabyte and its adapters
          # are covered by the benchmark sweep instead (see docs/decisions.md).
          .venv/bin/pip install -e ".[dev,world]"

      - name: Validate
        run: ./scripts/validate.sh
