# ResNet-50 on the corpus training half. Same schedule as
# configs/training/classification_full.yml, pointed at this run's archives.

training:
  candidate: resnet50-baseline
  dataset: datasets/corpus/train
  checkpoints: runs/debug/corpus/checkpoints
  epochs: 10
  batch_size: 1
  learning_rate: 0.0001
  seed: 0
  # Looks kept while an object crosses the camera footprint along the belt.
  # docs/frame-sampling.md. Three looks is about 13 minutes an epoch here.
  samples_per_crossing: 3
  accumulation_steps: 8
  class_balance: inverse
  validation_dataset: datasets/corpus/validation
  patience: 3
  window_exit_meters: 1.034
  act_chunk_size: 10
