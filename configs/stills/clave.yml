# The three figures the project page publishes.
#
# Presentation only. Every value here lights, frames or explains the scene and
# none of it reaches configs/world/sorting_line.yml, which data generation,
# training, validation and the benchmark all read. The world is built with the
# same configuration they use and is handed the lighting and the annotations as
# arguments, so a dataset recorded from this world carries neither.
#
# What each frame shows is a real rollout: the world runs from the seed below
# until the instant below, with the scripted expert driving the arm exactly as
# the recorder does, and the frame is whatever the renderer produced at that
# moment. Nothing is drawn on it afterwards. The ring, the window edges and the
# class markers are geometry standing in the scene, which is why they carry
# perspective and take shadow, and every quantity they express is read from the
# resolved layout or from the reachability sweep the safety layer consults.
#
# Lighting follows the FRET project-page stills: low headlight diffuse, grazing
# directional fills, and no shadow map.

still:
  name: clave
  description: >-
    The sorting line with the reach annulus, the edges of the reachable window
    and a marker over each package in the color of the channel it routes to.
    Two packages covering two material classes sit on the belt while the
    arm rides approach height over one of them.
  # Same moment as the thumbnail: arm over the centreline, not colliding.
  seed: 11
  capture_at_seconds: 28.75
  width: 1920
  height: 1080
  expect:
    packages: 2
    classes: 2

annotations:
  # One color per channel the object set needs. A channel the object set has
  # and this map does not is an error rather than a default color, because a
  # figure that draws one class in grey teaches a reader the wrong legend.
  channel_colors:
    CH-HDPE: [0.16, 0.70, 0.95]
    CH-FIBER: [0.95, 0.68, 0.20]
    CH-PLASTIC-OTHER: [0.82, 0.38, 0.86]
    CH-FERROUS: [0.36, 0.84, 0.50]
  # The chute mouths carry the same colors, so a reader can follow a marker to
  # the opening its class routes to without a caption.
  color_chutes: true
  reach_ring:
    # Both radii: the outer one bounds the annulus and the inner one is the
    # dead zone the belt carries an object out of.
    rgba: [0.28, 0.88, 0.96, 0.85]
    thickness_meters: 0.016
    segment_count: 180
  window_edges:
    rgba: [0.92, 0.95, 1.00, 0.28]
    thickness_meters: 0.014
    height_meters: 0.45
  class_markers:
    radius_meters: 0.032
    height_above_meters: 0.16

lighting:
  quality:
    shadowsize: 0
    offsamples: 8
  headlight:
    ambient: [0.26, 0.27, 0.29]
    diffuse: [0.04, 0.04, 0.05]
    specular: [0.28, 0.28, 0.28]
  background:
    top: [0.22, 0.23, 0.26]
    bottom: [0.40, 0.38, 0.36]
  lights:
    - position_meters: [1.40, -2.10, 1.15]
      direction: [-0.55, 0.72, -0.30]
      directional: true
      diffuse: [0.82, 0.80, 0.74]
      specular: [0.12, 0.12, 0.12]
      cast_shadow: false
    - position_meters: [-1.70, 1.90, 1.05]
      direction: [0.68, -0.66, -0.28]
      directional: true
      diffuse: [0.48, 0.50, 0.54]
      specular: [0.06, 0.06, 0.06]
      cast_shadow: false
    # A second key from across the line. The arm-side key leaves the
    # conveyor's far face unlit, and one of the three figures is shot from
    # over there.
    - position_meters: [-1.40, 2.20, 1.20]
      direction: [0.50, -0.72, -0.35]
      directional: true
      diffuse: [0.42, 0.41, 0.40]
      specular: [0.08, 0.08, 0.08]
      cast_shadow: false
    - position_meters: [2.20, -0.40, 0.95]
      direction: [-0.80, 0.20, -0.40]
      directional: true
      diffuse: [0.28, 0.24, 0.18]
      specular: [0.03, 0.03, 0.03]
      cast_shadow: false

cameras:
  # One camera per figure, named for the file it writes: clave-line.png,
  # clave-overhead.png and clave-window.png, which are the names the project
  # page already points at.
  # The line from across the belt, with the arm reaching toward the camera.
  # The chute mouths sit at belt height on the arm's own side, so they read
  # from here as openings the arm turns to rather than as containers, which
  # is what they are.
  - name: line
    azimuth_degrees: 332.0
    elevation_degrees: -26.0
    distance_meters: 4.00
    lookat_meters: [0.0, 0.05, 1.00]
    fovy_degrees: 42.0
  # Straight down, with the belt across the frame rather than along it, so the
  # ring and the belt both fit a sixteen by nine plate.
  - name: overhead
    azimuth_degrees: 90.0
    elevation_degrees: -88.0
    distance_meters: 3.30
    lookat_meters: [0.0, 0.0, 0.92]
    fovy_degrees: 45.0
  # Near belt height and along the line, which is the angle where the two window
  # planes read as the walls of a window rather than as lines.
  - name: window
    azimuth_degrees: 206.0
    elevation_degrees: -13.0
    distance_meters: 3.45
    lookat_meters: [0.15, -0.20, 1.02]
    fovy_degrees: 38.0
