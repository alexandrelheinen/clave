# A still of the sorting line, for a web page.
#
# Presentation only. Every value here lights or frames the scene and none of it
# reaches configs/world/sorting_line.yml, which data generation, training,
# validation and the benchmark all read. The world is built with the same
# configuration they use and is handed these lights as an argument, so a
# dataset recorded from this world is still lit by its single overhead light.
#
# What the frame shows is a real rollout, not a posed scene: the world runs
# from the seed below until the instant below, with the scripted expert driving
# the arm exactly as the recorder does, and the frame is whatever the renderer
# produced at that moment. Nothing is drawn on it afterwards.
#
# Lighting follows the FRET project-page stills: low headlight diffuse so the
# floor stays off the blowout point, and form from grazing directional fills.

still:
  name: thumbnail
  description: >-
    The manipulator mid-reach over the belt with two packages covering two
    material classes the object set has.
  # Seed 11 at 28.75 s, arm posed and not colliding: two packages, two
  # classes, flange near the belt centreline at approach height. A colliding
  # arm changed this count from machine to machine.
  seed: 11
  capture_at_seconds: 28.75
  width: 1920
  height: 1080
  expect:
    packages: 2
    classes: 2

lighting:
  quality:
    # Shadow maps from a top-down key stripe the floor at still resolution.
    # Form comes from the grazing fills; the map is left off.
    shadowsize: 0
    offsamples: 8
  headlight:
    ambient: [0.26, 0.27, 0.29]
    diffuse: [0.04, 0.04, 0.05]
    specular: [0.28, 0.28, 0.28]
  background:
    top: [0.22, 0.23, 0.26]
    bottom: [0.40, 0.38, 0.36]
  lights:
    # Near-horizontal key from the arm's side. Rakes the vertical faces and
    # barely touches the floor.
    - position_meters: [1.40, -2.10, 1.15]
      direction: [-0.55, 0.72, -0.30]
      directional: true
      diffuse: [0.82, 0.80, 0.74]
      specular: [0.12, 0.12, 0.12]
      cast_shadow: false
    # Opposite grazing fill; opens the shadow side of the castings.
    - position_meters: [-1.70, 1.90, 1.05]
      direction: [0.68, -0.66, -0.28]
      directional: true
      diffuse: [0.48, 0.50, 0.54]
      specular: [0.06, 0.06, 0.06]
      cast_shadow: false
    # Warm bounce along the belt, so packages separate from the conveyor.
    - position_meters: [2.20, -0.40, 0.95]
      direction: [-0.80, 0.20, -0.40]
      directional: true
      diffuse: [0.28, 0.24, 0.18]
      specular: [0.03, 0.03, 0.03]
      cast_shadow: false

cameras:
  # Three-quarter views down the length of the belt, from the arm's side.
  # Azimuth is measured from the belt axis, so 180 looks straight down it and
  # these sit 25 to 40 degrees off that. Re-aimed for the UR10e line: the arm
  # stands on a pedestal at y = -0.70 rather than over the belt, so the frame
  # centres between the arm and the line instead of on the belt alone. The
  # elevations stay steep because the warehouse dressing did not move with the
  # belt: a pallet jack stands at (-2.00, -1.65) and a shallower angle puts it
  # between the near-left camera and the machine.
  - name: near-left
    azimuth_degrees: 205.0
    elevation_degrees: -30.0
    distance_meters: 3.60
    lookat_meters: [0.0, -0.25, 1.05]
    fovy_degrees: 40.0
  - name: near-right
    azimuth_degrees: 148.0
    elevation_degrees: -28.0
    distance_meters: 3.40
    lookat_meters: [0.0, -0.25, 1.05]
    fovy_degrees: 42.0
  - name: low-three-quarter
    azimuth_degrees: 218.0
    elevation_degrees: -28.0
    distance_meters: 3.40
    lookat_meters: [0.0, -0.25, 1.02]
    fovy_degrees: 38.0
