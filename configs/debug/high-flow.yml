# A closer feed for one run, on the belt the shipped line already runs.
#
# Ask for this file with `clave sim --feed configs/debug/high-flow.yml`.
# The shipped world file is not edited.
#
# The v1.6.2 seed carried about six arrivals in thirty seconds, near 0.2
# objects per second, with the belt on the drive floor. That floor is
# 0.25 m/s. The shipped setpoint of 0.125 objects per second asks for
# 0.15 m/s at the shipped spacing, which the drive cannot do, so the
# controller already sits at 0.25 m/s. This file keeps that setpoint and
# that belt speed.
#
# Ten times the v1.6.2 flow is 2.0 objects per second, which at 0.25 m/s
# needs centers 0.125 m apart. The two largest packages, measured from
# the compiled meshes, have bounding radii 0.091 m and 0.089 m. Centers
# closer than 0.180 m can interpenetrate once a package tips onto its
# long side. v1.6.3 ran the belt at 2.40 m/s to reach 2.0 objects per
# second at the shipped spacing, and the arm picked nothing.
#
# 0.19 m clears those radii and still jams. A package that rolls into
# the side guide stops being driven, the next one catches it, and the
# step overflows. 0.20 m does the same on a thirty-second seed. 0.22 m
# is the dense spacing at which that seed still finishes. At 0.25 m/s
# the line then carries 0.25 / 0.22 = 1.14 objects per second. The
# setpoint stays 0.125, below what the drive floor delivers, so the
# controller holds the floor instead of speeding the belt up.

rate_objects_per_second: 0.125
belt_speed_meters_per_second: 0.25
spacing_meters: [0.22, 0.22]
