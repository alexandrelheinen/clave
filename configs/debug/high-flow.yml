# A feed faster than one arm clears, for one run.
#
# The shipped setpoint stays in configs/world/sorting_line.yml. Ask for
# this file with `clave sim --feed configs/debug/high-flow.yml`.
#
# The v1.6.2 seed, thirty seconds of ground truth, carried about six
# arrivals, near 0.2 objects per second. Ten times that flow is 2.0
# objects per second. Mean spacing on the shipped line is 1.20 m, so
# the belt has to run at 2.40 m/s. The shipped drive is 0.25 to 0.35 m/s
# and cannot deliver this rate. Passing --belt-speed alone does not
# hold it: the controller trims speed back toward the shipped setpoint.
#
# This file does not add an arm. The task machine, the chutes and the
# safety envelope stay one arm.

rate_objects_per_second: 2.0
belt_speed_meters_per_second: 2.4
