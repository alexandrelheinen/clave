# Where the tracker debug run films the world from.
#
# Not a demonstration scenario, which is why this sits in its own directory:
# `configs/demos/` holds scenarios the demo runner loads, and a file there
# without a `scenario` block fails that runner's own test.
#
# The tracker reads the nadir gate camera, and that view is the wrong one to
# watch: a grasp marker seen from straight above is a flat outline with no
# approach to read. So the run segments from the gate and renders for a human
# from one of the views below, and the two never share a camera.
#
# There are two views because one camera cannot do both jobs. Framing tight
# enough to read a 60 mm jaw puts the park pose outside the frame, and framing
# wide enough to hold the park pose renders a jaw a few pixels across. Rather
# than split the difference and do neither well, the run takes the view by
# name.

# The video renders on its own cadence, not on the capture cadence. The
# tracker settles twice a second, which is a fine rate to decide at and a
# terrible one to watch: at four frames a second the arm teleports between
# poses and none of the motion this is meant to show is visible.
video:
  frames_per_second: 30
  # Simulated seconds between rendered frames. At 0.0333 with 30 frames a
  # second the recording plays at real time, which is what a reader
  # comparing the arm against the belt needs.
  #
  # It was 0.01, which played at a third of real time and cost three times
  # the frames. Rendering is the whole cost of a run with video on: a sixty
  # second rollout is six thousand frames at 0.01 and eighteen hundred
  # here, against nine seconds of physics and segmentation put together.
  interval_seconds: 0.0333

# When true, downstream selection and trajectory planning consume ground-truth
# object states from MuJoCo physics rather than tracker estimates.
# The visual tracker continues to run concurrently.
ground_truth_tracker: false

default_view: line

views:
  # Close on the belt, where the grasp markers are readable. The park pose is
  # outside this frame by construction: it stands off the belt and downstream,
  # which is exactly where this view is not looking.
  belt:
    width: 960
    height: 540
    azimuth_degrees: 135.0
    elevation_degrees: -32.0
    distance_meters: 4.00
    lookat_meters: [-0.15, 0.00, 1.02]

  # The whole machine, including the park pose. Wide enough that a jaw is
  # small, which is the price of holding the arm, the belt and the place the
  # arm rests in one frame. This is the view for checking that the park pose
  # is where the configuration says and clear of everything it has to clear.
  line:
    width: 960
    height: 540
    azimuth_degrees: 180.0
    elevation_degrees: -26.0
    distance_meters: 4.00
    lookat_meters: [0.00, -0.45, 1.05]
