# Full-precision classification training configuration.
#
# Trains ResNet-50 from the initialization the candidate builder loads.
# The learning rate is the value below, annealed on a cosine schedule.

training:
  candidate: resnet50-baseline
  dataset: datasets/synthetic
  checkpoints: runs
  epochs: 10
  batch_size: 1
  learning_rate: 0.0001
  seed: 0
  samples_per_crossing: 3
  window_exit_meters: 1.034
  act_chunk_size: 10

