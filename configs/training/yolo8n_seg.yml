# YOLO-seg training configuration.
#
# Trains Ultralytics YOLOv8n-seg on corpus instance maps (no live simulator).
# Issue #117: AC-DET-12.

training:
  candidate: yolo8n-seg
  dataset: datasets/synthetic
  checkpoints: runs
  epochs: 5
  batch_size: 1
  learning_rate: 0.0001
  seed: 0
  samples_per_crossing: 3
  accumulation_steps: 1
  class_balance: none
  window_exit: 1.034
  act_chunk_size: 10
