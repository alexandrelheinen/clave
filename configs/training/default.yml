# Training.
#
# Every hyperparameter lives here. A learning rate buried in code cannot be
# swept, and a run whose settings are not recorded cannot be compared to another.

training:
  candidate: resnet50-baseline
  dataset: datasets/synthetic
  checkpoints: runs
  epochs: 150
  batch_size: 1
  learning_rate: 0.0003
  seed: 0
  # Looks kept while an object crosses the camera footprint along the belt.
  # docs/frame-sampling.md. A shorter crossing keeps every frame.
  samples_per_crossing: 3
  accumulation_steps: 1
  class_balance: none
  # Where the arm's reachable window ends, in belt frame meters. The scripted
  # expert is replayed against this to produce demonstrations, so a stale value
  # here teaches picks that cannot be made.
  #
  # Measured, not derived. Sweeping the compiled model with the tool held
  # vertical puts the window at 2.07 m of centerline running -1.034 m to
  # +1.034 m, so the exit is the downstream edge at 1.034 m.
  # docs/measurements.md carries the sweep. The value this replaced, 0.213, was
  # the half-window of the 0.24 m workspace the previous arm had, and it told
  # the expert the window closed 0.82 m before it does.
  window_exit_meters: 1.034
  # ACT predicts a chunk of future actions. v0.4.0 benchmarked the upstream
  # default of 100; captures here are half a second apart, so 100 would reach
  # far past the 1.13 second reachable window and be almost all padding.
  act_chunk_size: 10
