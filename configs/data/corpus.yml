# Perception corpus.
#
# One grid, two halves. Train and validation visit every speed and every
# spacing, and they do not share a seed. The live line's feed rate is not
# changed by this file: the arm still sees the setpoint in sorting_line.yml.
# These levels exist so a model can be trained on a stream denser and faster
# than the one arm can clear.

corpus:
  seed: 0
  seconds_per_rollout: 30.0
  capture_interval_seconds: 0.2
  frame_height: 480
  frame_width: 640
  belt_speeds_meters_per_second: [0.25, 0.30, 0.35]
  spacing_meters: [0.35, 0.70, 1.20]
  train_rollouts_per_cell: 8
  validation_rollouts_per_cell: 2
  out: datasets/corpus

  preview:
    seconds: 8.0
    belt_speed_meters_per_second: 0.30
    spacing_meters: 0.35
    frames_per_second: 5
    out: runs/debug/corpus/stream.mp4
