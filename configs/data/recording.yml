# Dataset recording.
#
# Every tunable lives here. Rendering runs on CPU through OSMesa at roughly 52
# milliseconds a frame at 320 by 240, so frame count is the cost driver: the
# defaults below produce a few hundred frames in about a minute.

recording:
  rollouts: 36
  seconds_per_rollout: 20.0
  capture_interval_seconds: 0.5
  frame_height: 240
  frame_width: 320

splits:
  # Partitioned by rollout, never by frame: two frames of one object are almost
  # perfectly correlated, so a frame-level split would leak.
  train: 0.60
  validation: 0.20
  test: 0.20
