# Arm control: which object, which phase, how fast, and where it rests.
#
# The workspace the arm is trusted over is not here. It comes from
# configs/world/sorting_line.yml, so the region the controller aims inside
# cannot drift from the region the safety layer enforces.
#
# READ THE PROVENANCE BESIDE EACH NUMBER. Some are measured, some are taken
# from what an arm of this class is built to do, and some are assumptions
# chosen so the loop can run at all. They are not interchangeable and the
# comments say which is which.

selection:
  # Weights urgency against travel in
  #   cost = distance_to_flange + exit_weight * distance_before_leaving
  # Both terms are meters, so this is dimensionless. At 1.0 an object half a
  # metre from leaving ranks with one half a metre further away, which is a
  # starting point and not a tuned value.
  exit_weight: 1.0

  # How far the tracker's estimate has to move before the anchor the ordering
  # scores follows it.
  #
  # An assumption, bounded from both sides rather than measured. The detection
  # camera resolves 0.449 mm per pixel, so a few pixels of segmentation jitter
  # is single-digit millimetres, and the smallest object in the set is about
  # 60 mm across. Twenty millimetres sits clear above the noise and well below
  # the point where a displacement should reorder anything.
  anchor_radius_meters: 0.020

task:
  # motion_only runs standby, tracking, parking and fault, which is what
  # tuning arm speed against belt speed needs: the flange rides at approach
  # height throughout and is stepped toward each marker in turn.
  #
  # full_visit plans the whole pick as timed arcs instead, and grasps. The
  # two are driven differently rather than differing only in phase count,
  # which is why the knob is a profile and not a flag.
  profile: full_visit

  # Where the flange rides while following an object, above the belt surface.
  # Sized at 0.300 m so the flange rides at z = 1.20 m, clearing the 0.04 m
  # side barrier with finger length 0.1558 m.
  approach_height_meters: 0.300

  # Flange clearance above the belt surface when crossing the belt barrier,
  # in meters. If omitted, defaults to approach_height_meters.
  safe_clearance_meters: 0.300

  # How close the flange has to be to the pose a phase asked for before it
  # counts as arrived.
  #
  # MEASURED, and the first value here was wrong for an instructive reason.
  # It was set at 10 mm from how precisely the solver converges, which is
  # about a millimetre. That is the wrong quantity: the flange is following a
  # pose the belt is moving, and what decides how close it gets is the
  # position actuators running one time constant behind a moving command,
  # not the solver. Sweeping the belt at the shipped speed puts the settled
  # error at 24.3 mm over most of the width and 60.9 mm at the far edge,
  # where the arm is most extended. At 10 mm no visit could ever complete.
  #
  # Seventy millimetres clears the worst of that with margin. It is the state
  # machine's definition of having arrived and not a quality gate: what a run
  # reports is the error each visit actually achieved.
  #
  # The lag is a lag and not a limit. A controller given the belt velocity as
  # a feedforward term would cancel most of it, which is a change to the
  # servo rather than to this number.
  arrival_tolerance_meters: 0.070

  # How long the flange holds station before the visit counts as served, and
  # under a full visit how long the jaw is given to close. The flange rides
  # with the belt throughout, so this is a carry and not a stop.
  #
  # Measured closing time for the 2F-85 tendon linkage in MuJoCo: 0.40 s gives
  # full stroke closure and stable pad contact before retreat.
  dwell_seconds: 0.40

  # How far above the object a planned approach ends, and how far the retreat
  # lifts it afterwards.
  #
  # Chosen, then checked against the descent algebra. Fifty millimetres is
  # about a third of the fingers' 155.8 mm length, so the pads are already
  # astride the object at the start of the descent rather than arriving from
  # above it. Small matters: everything about the interception is predicted
  # forward over the descent, so a taller clearance is a longer horizon and a
  # worse prediction.
  grasp_clearance_meters: 0.050

  # How fast the flange is coming down when it reaches that clearance, so the
  # approach and the descent chain without the arm stopping between them.
  #
  # An assumption, bounded by the algebra rather than measured. With the
  # clearance above it puts the descent at 2Z/V = 0.40 s, four fifths of the
  # 5Z/(2V) = 0.50 s beyond which the quintic dips below the object it is
  # descending onto. See docs/guidance-formulation.md for that derivation.
  approach_speed_meters_per_second: 0.25

  # The longest interception a pick will plan for. Past it the object is
  # refused rather than chased, which is the honest answer for something the
  # arm cannot reach in the belt it has left.
  #
  # MEASURED against the table in docs/guidance-formulation.md: from the park
  # pose, interceptions across the reachable window solve between 2.07 and
  # 2.48 s, and adding the descent puts the longest at 2.88 s. Four seconds
  # clears that with margin while still refusing an object that has already
  # run most of the way past the arm.
  interception_limit_seconds: 4.00

  # How much longer than the soonest feasible interception to take.
  #
  # MEASURED, and it is not cosmetic. The bisection returns the soonest arc
  # that fits, which by construction sits exactly on whichever ceiling binds,
  # and docs/guidance-formulation.md records that the binding one is always
  # speed. An arc on its ceiling cannot be re-aimed: every correction breaks
  # the bound it was already touching, so the refinement is refused and the
  # arm flies a three second old prediction onto an object that has drifted.
  # Running the shipped line at 1.00 produced one re-aim per visit, all of
  # them in the last half second.
  #
  # Fifteen percent is the smallest value that let a correction land on every
  # capture of the approach. It costs about 0.35 s per visit.
  interception_margin: 1.15

  # Where the arm rests when it has nothing to serve.
  #
  # The four bin mouths run from x = 0.30 m to x = 1.14 m at y = -0.42 m.
  # Park at their geometric centre: x = 0.72 m, y = -0.42 m. At z = 1.20 m
  # it remains inside the trusted vertical band, which runs 0.85 m to 1.35 m.
  park_position_meters: [0.72, -0.42, 1.20]

  # The park pose is drawn in the debug view so it can be seen rather than
  # trusted. Red, because nothing else in the scene is.
  park_marker_color: [0.85, 0.10, 0.10]

guidance:
  # Flange speed and acceleration bounds in task space.
  #
  # One metre per second is what a collaborative arm of this class sustains at
  # the tool, and it is a ceiling the controller respects rather than a figure
  # measured here. If the arm cannot keep up with the line, the belt slows
  # down: belt.speed_meters_per_second in configs/world/sorting_line.yml is
  # the knob for that, and slowing the line is honest where raising this
  # ceiling past what the machine does would not be.
  max_speed_meters_per_second: 1.00
  max_acceleration_meters_per_second_squared: 2.50

servo:
  # Fraction of each solved step commanded. One, meaning the solved angles go
  # out as they are: the arm's position actuators already run a
  # proportional-derivative loop, so interpolating ahead of them fights it.
  gain: 1.00

  # The bound a wrist singularity is judged against. Near a rank-deficient
  # Jacobian an undamped solver asks for enormous joint velocity for a small
  # Cartesian motion, and the requirement is that the command stays under this
  # rather than that the pose is met.
  #
  # An assumption at the conservative end of what an arm of this class turns
  # its major axes at. No datasheet was read for it.
  max_joint_speed_radians_per_second: 2.09

  # How far ahead of the commanded pose the servo aims, to cancel the lag a
  # position loop has against a moving command.
  #
  # MEASURED. Sweeping a target across the workspace from 0.15 to 1.00 m/s,
  # the steady-state lag divided by the speed is 38.6, 34.6, 34.0, 33.2,
  # 32.8 and 32.8 milliseconds. Flat, which is what makes it a time constant
  # rather than a distance, and 33 ms is where it settles at the speeds a
  # pick actually runs at.
  #
  # This is not cosmetic. The jaw's clear opening is 85.2 mm and the widest
  # object left in the set leaves 8.7 mm of side clearance, so a flange
  # trailing by more than that closes the jaw onto the object rather than
  # around it. At the belt speed the uncorrected lag is 10.7 mm and twelve
  # of seventeen objects have less clearance than the arrival error it
  # contributes to.
  lead_seconds: 0.033

calibration:
  # Where the flange has to sit relative to the pose the marker stands at, to
  # account for how the effector is mounted.
  #
  # Zero, and it stays zero until something measures it. There is no effector
  # on this arm, in the model or on a bench, so any non-zero value here would
  # be a correction for a mounting that does not exist.
  flange_offset_meters: [0.0, 0.0, 0.0]
