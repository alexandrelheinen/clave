# Simulated sorting line.
#
# Every tunable the world reads lives here. Nothing in clave.world carries a
# numeric default: a missing key fails at load naming itself, because a silently
# defaulted belt speed produces a world nobody can reproduce.
#
# A two-element value is a range that domain randomization draws from. A scalar
# is fixed across runs.
#
# Material class identifiers are from docs/waste-taxonomy.md and are append-only
# there.

physics:
  timestep_seconds: 0.002

belt:
  # Sized as a recovery-facility picking line rather than as a desk model. The
  # arm is a UR10e whose trusted workspace is an annulus 0.25 m to 1.25 m about
  # its base, measured by sweeping the compiled model with the tool held
  # vertical. A sweep confirms every lateral position on a 1.00 m belt is
  # reachable at some point in its travel. docs/measurements.md carries it.
  length_meters: 3.00
  # Narrowed from 1.00 m, and the reason is reach margin rather than cost.
  #
  # At 1.00 m the near edge sat at y = -0.50, which is 0.20 m from the arm
  # base in the lateral axis and therefore inside the 0.25 m dead zone the
  # annulus leaves around the base: a strip of the belt closest to the arm
  # could not be reached at all near x = 0. The far edge sat at 1.20 m of
  # radius, near the 1.25 m outer limit, where the arm is most extended and
  # its lag against a moving command is worst.
  #
  # At 0.50 m the near edge is 0.45 m of radius and the far edge 0.95 m, so
  # the whole width sits in the middle of the annulus. It also brings the
  # belt inside what the sensing gate actually images, which closes a defect
  # the roadmap carried. docs/measurements.md has both sweeps.
  width_meters: 0.50
  # Ergonomic picking-line height. A manual sort station puts the belt near a
  # standing operator's waist, and a robot retrofitted onto such a line
  # inherits it.
  surface_height_meters: 0.90
  # A range, drawn once per run from the seed, not a fixed speed. A line whose
  # speed never varies trains a policy that has memorised one speed.
  #
  # A robotic sorting line rather than a manual one, which is a class argument
  # and not a measurement of a particular machine. Manual picking lines run
  # slower because a human reaches at roughly 1 pick per 2 s; published robotic
  # sorters sustain 60 to 140 picks per minute. At the 0.31 m/s a fixed seed
  # draws, an object stays inside the arm's annulus for 6.60 s, against a
  # 1.0 second cycle budget.
  #
  # That figure was 3.3 s here and was wrong for the reason
  # docs/measurements.md records: the sweep behind it started at the origin
  # and so measured the downstream half of a window centred on it. The window
  # is 2.071 m, from -1.034 m to +1.034 m.
  speed_meters_per_second: [0.25, 0.35]
  # Side guides keep tipped cylinders from rolling off. A real line has them.
  guide_height_meters: 0.04
  # The belt is drawn as a row of conveyor modules from the CC BY 4.0 Open-RMF
  # model, scaled to the belt this file configures. The count and the length
  # above have to agree: ten modules of 0.300 m make the 3.00 m belt. The
  # module is published at 0.500 by 0.504 by 0.502 m and each axis is scaled
  # independently, which the README tabulates.
  #
  # The physics is unchanged. The belt an object rests on is still the box
  # above, and the modules are visual geometry with no collision, so the module
  # count moves nothing that was ever measured.
  modules: 10

spawn:
  # Objects are recycled from a fixed pool, because a compiled MuJoCo model
  # cannot gain bodies at run time. The pool bounds how many objects can be on
  # the belt at once.
  pool_size: 22
  # Objects enter this far inside the belt's leading edge. Spawning exactly on
  # the edge lets an object tip off before the belt drive engages.
  entry_margin_meters: 0.08
  # Objects are released every so many metres of belt travel, not every so
  # many seconds. A metering feeder doses by distance, and that is what makes
  # belt speed a throughput knob: the arrival rate is speed over spacing. Fed
  # by time, the rate is one over the interval whatever the belt does, and
  # the controller below would have no authority over the quantity it is
  # asked to regulate. docs/requirements/line-throughput.md carries the
  # arithmetic.
  #
  # A mean spacing of 1.20 m against the 0.25 objects per second the arm
  # sustains puts the belt at 0.300 m/s, which sits in the middle of the
  # drive's range, so the controller has room in both directions.
  spacing_meters: [1.00, 1.40]
  # Inside the belt's half width, keeping the same 0.08 m clearance from the
  # side guides that the 1.00 m belt used. The whole span is reachable, so
  # this range does not deliberately place objects the arm has to refuse.
  lateral_offset_meters: [-0.17, 0.17]
  drop_height_meters: [0.01, 0.03]

# Holding the line at a rate rather than letting it be whatever the feeder
# produced. docs/requirements/line-throughput.md carries the spec.
feed:
  # What the line is asked to carry.
  #
  # MEASURED against what the arm sustains rather than chosen. A visit costs
  # the interception, the descent, the dwell and the retreat, and the arm
  # returns toward park between visits; on the shipped geometry that came to
  # 7.5 completed visits in 60 s, which is 0.125 objects per second, or 7.5 a
  # minute. This is half the previous setpoint, giving the arm twice the time
  # per object while retaining the same distance-based feeder.
  #
  # A setpoint above what the arm holds is not an error and is not clamped: a
  # line fed faster than it can be picked is an ordinary condition, and it
  # shows up as objects reaching the end unpicked.
  rate_objects_per_second: 0.125

  # How long a span the measured rate is counted over.
  #
  # MEASURED, and the first value was too short for an instructive reason. A
  # rate is a count divided by a window, so its uncertainty is the square
  # root of the count: at this setpoint a 30 s window holds about 7 objects
  # and estimates the rate to roughly a third. The loop then chases that
  # noise and pins itself to a drive limit, which is what the shipped line
  # did, sitting at 0.250 m/s while reading 0.267 against a 0.250 setpoint.
  #
  # Ninety seconds holds about 22 objects and estimates the rate to roughly a
  # fifth. A slow line cannot be metered quickly, and that is arithmetic
  # rather than a tuning failure.
  window_seconds: 90.0

  # Metres per second of belt speed per object per second of error, and the
  # same per accumulated error second.
  #
  # A starting point rather than a tuned pair. The proportional term alone
  # leaves steady-state error, because holding the rate needs a non-zero
  # speed and a proportional term produces output only from error; the
  # integral term is what sits the loop on the setpoint. Derivative earns
  # nothing here, since the measured rate is already a windowed average and
  # carries the noise a derivative would amplify.
  # The controller is positional: both terms are added to the speed the run
  # drew, not to the speed commanded last tick. The velocity form was tried
  # and is wrong here, because adding a proportional term to the command at
  # the physics rate makes that term an integrator of its own, five hundred
  # times a second, and the loop pins itself to a drive limit on any error.
  #
  # At 0.40, an error of one tenth of an object per second moves the belt by
  # 0.04 m/s, which is a third of the drive's range: firm without being able
  # to cross the range on counting noise alone. The integral term supplies
  # whatever standing offset the realised spacing needs, and at 0.01 it takes
  # about a hundred seconds to do it, which is the order of the measurement
  # window and therefore as fast as the loop can see.
  proportional_gain: 0.40
  integral_gain: 0.01

arm:
  # A Universal Robots UR10e, adopted from MuJoCo Menagerie and vendored under
  # third_party/mujoco_menagerie_ur10e/. A validated model derived from
  # manufacturer CAD outranked the SCARA authored here, and it costs something:
  # the arm is slower, and two of its six axes go unused.
  #
  # Beside the belt, on a pedestal, not overhead. A six-axis arm inverted above
  # a plane is near-singular pointing straight down; a sweep with the tool held
  # vertical found 3 of 27 sample points reachable that way against full belt
  # coverage from the side.
  #
  # This is the top of the pedestal, which is the arm's own base. 0.70 m from
  # the centreline puts the whole 1.00 m belt inside the annulus below, with the
  # working range running 0.60 m to 0.75 m.
  base_position_meters: [0.0, -0.70, 0.90]
  # The pedestal's footprint. Its half-diagonal stays inside `reach_min_meters`,
  # so the arm cannot drive into the support carrying it.
  pedestal_footprint_meters: [0.30, 0.30]
  # The annulus the arm is trusted over, measured by sweeping the compiled model
  # with the tool held vertical rather than derived from link lengths: a
  # six-axis arm under an orientation constraint has no closed-form workspace.
  # The sweep put the inner limit at 0.200 m and the outer between 1.266 m and
  # 1.309 m by bearing; these sit inside both, so the trusted region is strictly
  # smaller than the reachable one. docs/measurements.md carries the sweep.
  reach_min_meters: 0.25
  reach_max_meters: 1.25
  # Where the flange is trusted, relative to the arm's own base rather than to
  # the belt, because that is the frame the sweep measured in. Solutions exist
  # well past both ends; these stop short on purpose.
  tool_above_base_meters: [-0.05, 0.45]
  # The widest object the end effector handles.
  #
  # MEASURED FROM THE EFFECTOR THAT IS NOW ON THE ARM. The Robotiq 2F-85's
  # catalogue stroke is 85 mm, and the compiled model separates its pads by
  # 98.4 mm fully open and 14.9 mm fully closed. The catalogue figure is the
  # one used, because it is the clear opening between pad faces rather than
  # between body origins.
  #
  # This was 180 mm while the effector was hypothetical, and lowering it is
  # what refuses `master_chef_can`: a cylinder 102.5 by 103.2 mm, so it does
  # not fit in any orientation. It was removed from the object set below,
  # which costs one object in eighteen and no class, and which halves the
  # barcode decode yield because it was one of only two objects that ever
  # decoded. docs/measurements.md carries the re-measured figure.
  max_grasp_width_meters: 0.085

# The end effector on the arm.
#
# A Robotiq 2F-85, vendored under third_party/mujoco_menagerie_robotiq_2f85/
# from the same Menagerie commit the UR10e came from. It replaced a set of
# stated assumptions, and the numbers below are now read off the compiled
# model rather than chosen.
#
# The jaw opening is not repeated here. It is `arm.max_grasp_width_meters`,
# which already bounds the object set, and a second copy would let the two
# drift until the world spawned objects its own gripper could not close on.
effector:
  # How far the pads sit below the face the tool bolts to. This is the whole
  # shift between where an object is and where the arm has to put its flange.
  #
  # MEASURED from the compiled model, as the distance from the arm's
  # `attachment_site` to the gripper's own `pinch` site. It was 90 mm while
  # the effector was an assumption and the real one is 155.8 mm. A test reads
  # both sites out of the compiled model and fails if this drifts from them,
  # so re-copying the vendored gripper cannot move it silently.
  finger_length_meters: 0.1558
  # One pad, in its own three directions: thickness along the way it travels
  # to close, depth across that horizontally, and height vertically. A pad is
  # drawn to scale, so a marker that looks like it would collide probably
  # would.
  pad_thickness_meters: 0.012
  pad_depth_meters: 0.040
  pad_height_meters: 0.050
  # Where the pads close, measured up from the belt surface.
  #
  # This stands in for a height nobody measures. The gate looks straight down
  # and estimates no depth, the `Height` role is refused at intake, and a
  # `WasteObject` on this line therefore carries no height at all. A depth
  # sensor would replace this constant with a reading and change nothing else.
  # Pick offset from the pad closing plane to the conveyor belt surface. Keep
  # this in YAML because it depends on the installed end effector and the
  # desired approach clearance, not on the tracker or arm controller.
  grasp_height_meters: 0.005

# Where a picked object goes. One funnel per channel the routing policy
# resolves to, set beside the belt at belt height on the arm's own side, each
# feeding a take-away conveyor below it. docs/requirements/sorting-outputs.md
# carries why a funnel and not a container or a lane, and every number here
# is checked against the arm's annulus at load rather than trusted.
chutes:
  # Measured from the belt centreline, so it has to clear the belt's half
  # width, which is 0.25 m. At 0.42 m the mouth stands 0.17 m clear of the
  # side guide and 0.13 m clear of the pedestal face at y = -0.55, and the
  # mouth centre sits 0.28 m from the base in the lateral axis, outside the
  # 0.25 m dead zone the annulus leaves around it.
  #
  # Negative because the arm stands at y = -0.70. Putting the bank on the far
  # side would make every release a reach across the line.
  offset_from_belt_meters: -0.42

  # Where the bank starts along belt travel, and how far apart the mouths sit.
  #
  # The bank is pushed downstream rather than centred on the arm, and that is
  # the pedestal's doing rather than an aesthetic choice. A bank of four
  # centred on x = 0 always straddles the pedestal's 0.30 m footprint, and a
  # take-away conveyor running out from under those two mouths would pass
  # through the structure carrying the arm. Starting at x = +0.30 m puts the
  # nearest mouth 0.04 m clear of that footprint.
  #
  # At 0.28 m spacing the four mouths stand at x = 0.30, 0.58, 0.86 and 1.14,
  # which is 0.41 m to 1.17 m of radius from the base: inside the 1.25 m outer
  # limit with 80 mm to spare on the furthest.
  first_position_meters: 0.30
  spacing_meters: 0.28

  # The mouth is what the arm releases over and the throat is what the object
  # falls through. A funnel rather than a hole, so an object let go near an
  # edge is guided in rather than left on a lip.
  mouth_meters: [0.22, 0.22]
  throat_meters: [0.12, 0.12]
  throat_height_meters: 0.62

  # The take-away conveyor under each throat. Plant downstream of the opening:
  # nothing measures it, nothing collides with it, and it runs off the end of
  # the world. It is here so a funnel does not end in nothing, and so a reader
  # watching a run can see where a channel goes.
  takeaway:
    surface_height_meters: 0.30
    width_meters: 0.24
    length_meters: 1.40

structure:
  # The belt and the arm used to float. Nothing below changes a trajectory: a
  # support is static geometry under equipment that already rested on nothing,
  # and the belt surface, the arm base and every measured quantity keep their
  # heights. It is here because a scene meant for an audience should look like
  # equipment rather than like floating boxes.
  #
  # Belt legs, as a bench conveyor has: four uprights under the frame.
  leg_side_meters: 0.025
  leg_inset_meters: 0.12
  # The frame the belt surface sits on, spanning the legs.
  frame_depth_meters: 0.05
  # The pedestal the manipulator is bolted to is not described here. It was,
  # as a cylinder with a mounting plate, and nothing has read those three
  # keys since it became a box sized by arm.pedestal_footprint_meters.

environment:
  # Scene dressing from the MIT-0 AWS RoboMaker warehouse, the same collection
  # FRET uses. It changes nothing the simulation measures: every prop is static
  # geometry placed clear of the belt and the workspace, and the overhead camera
  # the models see looks straight down at the belt.
  #
  # The meshes are generated by scripts/import_warehouse_assets.py and are not
  # committed. A world built without them keeps the plain floor and says so.
  #
  # Each prop names a mesh, where it stands, and how far it is turned. The
  # near props stand further out than they did on the 0.32 m belt: the channel
  # chute bank now sits 0.42 m from the centreline on the arm's side, and a
  # prop at 0.95 m stood against the old floor bins rather than clear of the
  # line.
  props:
    - mesh: shelf.obj
      position_meters: [-0.40, 2.30, 0.0]
      yaw_degrees: 0.0
    - mesh: shelf_e.obj
      position_meters: [-0.40, -2.40, 0.0]
      yaw_degrees: 180.0
    - mesh: trash_can.obj
      position_meters: [1.75, -1.50, 0.0]
      yaw_degrees: 25.0
    - mesh: pallet_jack.obj
      position_meters: [-2.00, -1.65, 0.0]
      yaw_degrees: 70.0
    - mesh: bucket.obj
      position_meters: [1.70, 1.60, 0.0]
      yaw_degrees: 0.0

# Every sensor that observes the belt. The tracker fuses by `role` and never
# by `id`, so adding, moving or removing a camera changes this list and nothing
# in clave.tracker. docs/architecture.md states that contract.
#
# A camera names the parts it is built from rather than a field of view. An
# angle is a consequence of a sensor and a lens, and one written directly is a
# number nobody can check against a catalog, so `fovy` is derived and never
# configured. Changing the lens on a line changes one key here.
#
# All of them look straight down. A nadir view keeps the image plane parallel to
# the belt, so pixel to world is a scale factor rather than a homography that
# varies across the frame, an object's footprint in pixels is its footprint on
# the belt, and a barcode lies parallel to the sensor where it is most legible.
# Objects travel in a single layer, so nothing occludes anything from directly
# above. A tilt buys a little height information and costs all of that.
#
# The belt is centred on the origin and runs from x = -1.50 to +1.50, with
# travel towards +x, so the arm stands over the origin and the gate sits
# upstream of it at x = -1.00. An object is seen once, under controlled light,
# and is then carried to the arm by a belt whose speed is known, so the tracker
# propagates it by dead reckoning instead of re-detecting it every frame.

sensors:
  # Sony IMX264: 2/3 inch, 5.0 MP global shutter, Pregius second generation,
  # carried by Basler ace, LUCID Phoenix, JAI GO-X and others. Global shutter
  # matters on a moving belt: a rolling shutter skews a barcode into something
  # no decoder will read.
  imx264:
    pixels: [2448, 2048]
    pixel_pitch_micrometers: 3.45

lenses:
  # Fujinon HF-XA-5M, C-mount, specified for a 2/3 inch sensor at this exact
  # 3.45 micrometre pitch, so the lens and the sensor above are a matched pair
  # rather than two parts that happen to thread together. The series runs 6, 8,
  # 12, 16, 25, 35 and 50 mm; only the two this line uses are declared.
  hf8xa-5m:
    focal_length_millimeters: 8.0
  hf16xa-5m:
    focal_length_millimeters: 16.0

cameras:
  # `long_axis` is which belt axis the sensor's longer side spans. It is the
  # cheapest parameter on this page and it was the wrong way round: a 16 by 9
  # or 4 by 3 sensor laid out along belt travel wastes its long side on a
  # direction the object crosses anyway, and spends its short side on the width
  # it has to cover. Turning every camera a quarter turn is what makes the
  # numbers below fit at all.

  # Detection, classification and segmentation across the whole belt.
  # 8.446 mm of sensor at 8 mm focal length over a 1.042 m standoff gives
  # 1.100 m across a 1.000 m belt, so the width is covered with 50 mm of margin
  # at each edge, at 0.449 mm per pixel. Objects spawn out to 0.42 m and every
  # one of them is now in frame.
  - id: gate_wide
    role: detection
    sensor: imx264
    lens: hf8xa-5m
    long_axis: across
    position_meters: [-1.00, 0.0, 1.942]

  # Detection again, over the part of the belt the arm can actually reach.
  #
  # MEASURED, and it is the difference between picking an object and picking
  # a prediction. Sweeping an object along the belt and reading the
  # segmentation, `gate_wide` detects it out to x = -0.275 m and no further.
  # The arm's annulus runs to x = +1.034 m on the centreline, so 1.31 m of
  # the zone the arm actually works in was never observed: every pick there
  # was made on an estimate dead reckoned since the object left the gate.
  #
  # The same sweep puts one camera's reach at about 0.72 m either side of
  # itself, so a single one at x = +0.38 m covers -0.345 m to +1.105 m. That
  # overlaps the gate by 70 mm and reaches past the far edge of the annulus,
  # which closes the zone with one camera rather than the three an earlier
  # attempt used.
  #
  # Same sensor, lens and standoff as the gate, so its pixels are worth the
  # same on the belt and the fusion has no calibration step to get wrong.
  - id: pick_wide
    role: detection
    sensor: imx264
    lens: hf8xa-5m
    long_axis: across
    position_meters: [0.38, 0.0, 1.942]

  # Barcode reading. An EAN-13 narrow module is about 0.33 mm and decoding
  # wants roughly two pixels across it, so 0.165 mm per pixel is the floor.
  # A 16 mm lens over the same 0.730 m standoff gives 0.385 m across at
  # 0.157 mm per pixel, which clears the floor rather than sitting on it.
  #
  # Three of them at 0.33 m spacing span -0.523 m to +0.523 m with 56 mm of
  # overlap between neighbours, so the belt is tiled rather than sampled. The
  # previous arrangement stood them 0.342 m apart while each saw 0.192 m, which
  # left a dead band on each side where no barcode could be read at all.
  - id: gate_code_left
    role: code
    sensor: imx264
    lens: hf16xa-5m
    long_axis: across
    position_meters: [-1.00, 0.33, 1.630]
  - id: gate_code_center
    role: code
    sensor: imx264
    lens: hf16xa-5m
    long_axis: across
    position_meters: [-1.00, 0.0, 1.630]
  - id: gate_code_right
    role: code
    sensor: imx264
    lens: hf16xa-5m
    long_axis: across
    position_meters: [-1.00, -0.33, 1.630]

lighting:
  diffuse: [0.45, 0.80]

objects:
  # Every object is a scanned photograph of a real package. The parametric
  # cylinders and boxes this world used through v1.0.3 are gone: they taught a
  # classifier shape rather than material, which is the limitation v0.5.0
  # recorded and nothing had removed until now.
  #
  # What is here is what the gripper can close on. Measuring all 1,030 scanned
  # objects and both YCB collections found 276 under 52 mm across their
  # narrowest horizontal axis, and these are the ones among them that are
  # recyclable packaging rather than plant saucers, hard drives or toys.
  #
  # Two things a reader has to know.
  #
  # Four of the eleven taxonomy classes have an object. PET, PP, aluminum,
  # glass, corrugated board and beverage carton have none, because nothing made
  # of them in either collection fits a 55.7 mm gripper: a soda can is 66 mm, a
  # bleach bottle 68 mm, the narrowest cup 57 mm. Six classes were asked for
  # and this set has four, which is recorded here rather than hidden.
  #
  # The material class is inferred from what the package is, not measured. A
  # supplement tub is taken as HDPE, a candy carton as paperboard, a tuna can
  # as steel. The synthetic set this replaces had its material true by
  # construction, so this is label noise the world did not have before, traded
  # for appearance it also did not have.

  # --- M-02, high-density polyethylene: supplement tubs and toiletry bottles ---

  # The pool fills its slots by walking this list in order, so the list order
  # decides which objects a short run ever spawns. Grouping the classes put
  # five HDPE tubs in the first five slots and left paperboard with one record
  # in twenty-four seeded runs. The classes alternate here for that reason, and
  # the comment is what keeps somebody from tidying them back into groups.

  - name: silicon_bottle
    material_class: M-02
    shape: mesh
    mesh: third_party/scanned_objects/models/JarroSil_Activated_Silicon/model.obj
    texture: third_party/scanned_objects/models/JarroSil_Activated_Silicon/texture.png
    density_kg_per_m3: [70, 130]

  - name: gelatin_box
    material_class: M-09
    shape: mesh
    mesh: third_party/ycb_sim/meshes/009_gelatin_box.msh
    texture: third_party/ycb_sim/textures/009_gelatin_box.png
    density_kg_per_m3: [90, 160]

  # The YCB packages that remain have both narrowest sides below the current
  # 85 mm jaw opening. Flat packages with only one thin side are excluded by
  # the compiled-mesh check rather than being allowed onto the belt.
  - name: tomato_soup_can
    material_class: M-06
    shape: mesh
    mesh: third_party/ycb_sim/meshes/005_tomato_soup_can.msh
    texture: third_party/ycb_sim/textures/005_tomato_soup_can.png
    density_kg_per_m3: [180, 320]

  # --- M-09, paperboard: the cartons a kitchen produces most of ---

  - name: coq10_tub
    material_class: M-02
    shape: mesh
    mesh: third_party/scanned_objects/models/CoQ10/model.obj
    texture: third_party/scanned_objects/models/CoQ10/texture.png
    density_kg_per_m3: [70, 130]

  - name: sprinkles_jar
    material_class: M-04
    shape: mesh
    mesh: third_party/scanned_objects/models/Wilton_Pearlized_Sugar_Sprinkles_525_oz_Gold/model.obj
    texture: third_party/scanned_objects/models/Wilton_Pearlized_Sugar_Sprinkles_525_oz_Gold/texture.png
    density_kg_per_m3: [70, 130]

  # --- M-06, ferrous metal ---

  - name: candy_carton
    material_class: M-09
    shape: mesh
    mesh: third_party/scanned_objects/models/Nestle_Candy_19_oz_Butterfinger_Singles_116567/model.obj
    texture: third_party/scanned_objects/models/Nestle_Candy_19_oz_Butterfinger_Singles_116567/texture.png
    density_kg_per_m3: [90, 160]

  - name: folic_acid_tub
    material_class: M-02
    shape: mesh
    mesh: third_party/scanned_objects/models/Folic_Acid/model.obj
    texture: third_party/scanned_objects/models/Folic_Acid/texture.png
    density_kg_per_m3: [70, 130]

  - name: haircolor_bottle
    material_class: M-02
