# Simulated sorting line.
#
# Every tunable the world reads lives here. Nothing in clave.world carries a
# numeric default: a missing key fails at load naming itself, because a silently
# defaulted belt speed produces a world nobody can reproduce.
#
# A two-element value is a range that domain randomization draws from. A scalar
# is fixed across runs.
#
# Material class identifiers are from docs/waste-taxonomy.md and are append-only
# there.

physics:
  timestep_seconds: 0.002

belt:
  # The line is sized for the manipulator it has rather than for a picture of a
  # recovery facility. A solved workspace sweep put the effector 0.266 m from
  # its base in the grasp band, so a belt wider than the arm can cross carries
  # objects nothing can pick. docs/research/world-scale.md has the sweep.
  length_meters: 1.20
  # Wider than one arm can cover on purpose. A real line is sized by throughput
  # rather than by a single manipulator's reach, and covering the far side is a
  # second arm's job rather than a reason to narrow the belt. The safety layer
  # already refuses a pick outside the workspace, so the uncovered strip costs
  # throughput and nothing else.
  width_meters: 0.32
  surface_height_meters: 0.35
  # Half of what v1.0.1 set, which was already at the effector's own useful
  # speed of roughly 0.10 m/s. An object now crosses the workspace slowly
  # enough to watch, and the arm has several seconds of margin rather than
  # none.
  speed_meters_per_second: [0.02, 0.05]
  # Side guides keep tipped cylinders from rolling off. A real line has them.
  guide_height_meters: 0.04

spawn:
  # Objects are recycled from a fixed pool, because a compiled MuJoCo model
  # cannot gain bodies at run time. The pool bounds how many objects can be on
  # the belt at once.
  pool_size: 12
  # Objects enter this far inside the belt's leading edge. Spawning exactly on
  # the edge lets an object tip off before the belt drive engages.
  entry_margin_meters: 0.08
  interval_seconds: [0.8, 2.5]
  # Inside the belt's half width, so nothing spawns against a side guide.
  # Spanning the whole belt means some objects land on the strip the single
  # arm cannot reach, which is the honest consequence of a belt wider than one
  # manipulator.
  lateral_offset_meters: [-0.13, 0.13]
  drop_height_meters: [0.01, 0.03]

arm:
  # Placed beside the belt, facing it. The OpenMANIPULATOR-X is a 4 degree of
  # freedom arm with a parallel gripper, loaded from the pinned submodule.
  #
  # Beside the belt rather than over it. Doubling the belt width put the old
  # 0.14 m offset inside the belt's own footprint, which left the pedestal
  # passing through the conveyor. The base now clears the belt edge by the
  # width of its mounting plate, and the centerline sits 0.22 m away, inside
  # the 0.266 m the workspace sweep measured.
  #
  # The far half of the belt is outside the workspace and is meant to be: a
  # second arm covers it. An object landing there is a throughput loss the
  # safety layer already refuses to turn into a pick.
  base_position_meters: [0.0, -0.22, 0.35]
  # The solved workspace, not the link geometry. Forward kinematics over 83,521
  # joint combinations put the effector at most 0.266 m from its base in the
  # grasp band; 0.25 m keeps a margin under that. The old 0.38 m was an upper
  # bound v0.5.0 recorded as one and nothing had checked since.
  reach_radius_meters: 0.25
  # The widest object the gripper can close on, measured from the mesh vertices
  # of the pinned OpenMANIPULATOR-X fingers: 55.7 mm of clear opening when the
  # gripper joint is at its upper limit. Every object below declares a grasp
  # width under this and the world refuses to build if one does not.
  max_grasp_width_meters: 0.045

bins:
  # One bin per distinct channel across the object set below.
  spacing_meters: 0.12
  size_meters: [0.05, 0.05, 0.04]
  offset_from_belt_meters: 0.32

structure:
  # The belt and the arm used to float. Nothing below changes a trajectory: a
  # support is static geometry under equipment that already rested on nothing,
  # and the belt surface, the arm base and every measured quantity keep their
  # heights. It is here because a scene meant for an audience should look like
  # equipment rather than like floating boxes.
  #
  # Belt legs, as a bench conveyor has: four uprights under the frame.
  leg_side_meters: 0.025
  leg_inset_meters: 0.12
  # The frame the belt surface sits on, spanning the legs.
  frame_depth_meters: 0.05
  # The pedestal the manipulator is bolted to.
  # Narrow enough that the mounting plate clears the belt edge.
  pedestal_radius_meters: 0.045
  pedestal_plate_radius_meters: 0.055
  pedestal_plate_thickness_meters: 0.012

environment:
  # Scene dressing from the MIT-0 AWS RoboMaker warehouse, the same collection
  # FRET uses. It changes nothing the simulation measures: every prop is static
  # geometry placed clear of the belt and the workspace, and the overhead camera
  # the models see looks straight down at the belt.
  #
  # The meshes are generated by scripts/import_warehouse_assets.py and are not
  # committed. A world built without them keeps the plain floor and says so.
  #
  # Each prop names a mesh, where it stands, and how far it is turned.
  props:
    - mesh: shelf.obj
      position_meters: [-0.40, 2.30, 0.0]
      yaw_degrees: 0.0
    - mesh: shelf_e.obj
      position_meters: [-0.40, -2.40, 0.0]
      yaw_degrees: 180.0
    - mesh: trash_can.obj
      position_meters: [1.30, -0.95, 0.0]
      yaw_degrees: 25.0
    - mesh: pallet_jack.obj
      position_meters: [-1.45, -1.10, 0.0]
      yaw_degrees: 70.0
    - mesh: bucket.obj
      position_meters: [1.25, 1.05, 0.0]
      yaw_degrees: 0.0

camera:
  height_above_belt_meters: [0.45, 0.60]
  fovy_degrees: [45.0, 60.0]

lighting:
  diffuse: [0.45, 0.80]

objects:
  # size_a / size_b are interpreted per shape:
  #   cylinder -> radius, half-length
  #   box      -> half-width, half-height
  #
  # The grasp width is twice size_a for both shapes, and every entry keeps it
  # under arm.max_grasp_width_meters. That bound comes from the gripper's own
  # mesh and it is what decides the scale of this object set: these are the
  # small containers a 56 mm gripper can close on, not the two litre bottles a
  # recovery facility sees. A larger object set needs a larger gripper, which
  # is a different arm rather than a different number here.
  - name: drink_bottle
    material_class: M-01
    shape: cylinder
    size_a_meters: [0.016, 0.021]
    size_b_meters: [0.055, 0.080]
    density_kg_per_m3: [55, 110]

  - name: milk_jug
    material_class: M-02
    shape: box
    size_a_meters: [0.015, 0.020]
    size_b_meters: [0.050, 0.070]
    density_kg_per_m3: [70, 130]

  - name: yogurt_tub
    material_class: M-03
    shape: cylinder
    size_a_meters: [0.017, 0.022]
    size_b_meters: [0.022, 0.035]
    density_kg_per_m3: [80, 150]

  - name: drink_can
    material_class: M-05
    shape: cylinder
    size_a_meters: [0.016, 0.019]
    size_b_meters: [0.045, 0.060]
    density_kg_per_m3: [40, 90]

  - name: food_can
    material_class: M-06
    shape: cylinder
    size_a_meters: [0.018, 0.022]
    size_b_meters: [0.025, 0.040]
    density_kg_per_m3: [180, 320]

  - name: glass_bottle
    material_class: M-07
    shape: cylinder
    size_a_meters: [0.015, 0.020]
    size_b_meters: [0.055, 0.085]
    density_kg_per_m3: [380, 620]

  - name: shipping_box
    material_class: M-08
    shape: box
    size_a_meters: [0.018, 0.022]
    size_b_meters: [0.020, 0.035]
    density_kg_per_m3: [60, 120]

  - name: beverage_carton
    material_class: M-10
    shape: box
    size_a_meters: [0.016, 0.021]
    size_b_meters: [0.045, 0.065]
    density_kg_per_m3: [70, 140]
