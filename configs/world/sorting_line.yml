# Simulated sorting line.
#
# Every tunable the world reads lives here. Nothing in clave.world carries a
# numeric default: a missing key fails at load naming itself, because a silently
# defaulted belt speed produces a world nobody can reproduce.
#
# A two-element value is a range that domain randomization draws from. A scalar
# is fixed across runs.
#
# Material class identifiers are from docs/waste-taxonomy.md and are append-only
# there.

physics:
  timestep_seconds: 0.002

belt:
  # Sized as a recovery-facility picking line rather than as a desk model. The
  # arm is a UR10e whose trusted workspace is an annulus 0.25 m to 1.25 m about
  # its base, measured by sweeping the compiled model with the tool held
  # vertical. A sweep confirms every lateral position on a 1.00 m belt is
  # reachable at some point in its travel. docs/measurements.md carries it.
  length_meters: 3.00
  # Fully covered, which the previous belt was not. A swept check finds all 51
  # lateral samples across this width reachable, so nothing here is written off
  # as a second arm's job the way the previous line's far strip was.
  width_meters: 1.00
  # Ergonomic picking-line height. A manual sort station puts the belt near a
  # standing operator's waist, and a robot retrofitted onto such a line
  # inherits it.
  surface_height_meters: 0.90
  # A robotic sorting line rather than a manual one. Manual picking lines run
  # slower because a human reaches at roughly 1 pick per 2 s; published
  # robotic sorters sustain 60 to 140 picks per minute. At 0.31 m/s an object
  # stays inside the arm's annulus for 3.3 s crossing the centerline, which is
  # ample against the 1.0 second cycle budget AC-CYCLE-01 sets.
  speed_meters_per_second: [0.25, 0.35]
  # Side guides keep tipped cylinders from rolling off. A real line has them.
  guide_height_meters: 0.04
  # The belt is drawn as a row of conveyor modules from the CC BY 4.0 Open-RMF
  # model, scaled to the belt this file configures. The count and the length
  # above have to agree: ten modules of 0.300 m make the 3.00 m belt. The
  # module is published at 0.500 by 0.504 by 0.502 m and each axis is scaled
  # independently, which the README tabulates.
  #
  # The physics is unchanged. The belt an object rests on is still the box
  # above, and the modules are visual geometry with no collision, so the module
  # count moves nothing that was ever measured.
  modules: 10

spawn:
  # Objects are recycled from a fixed pool, because a compiled MuJoCo model
  # cannot gain bodies at run time. The pool bounds how many objects can be on
  # the belt at once.
  pool_size: 22
  # Objects enter this far inside the belt's leading edge. Spawning exactly on
  # the edge lets an object tip off before the belt drive engages.
  entry_margin_meters: 0.08
  interval_seconds: [0.8, 2.5]
  # Inside the belt's half width, so nothing spawns against a side guide. The
  # whole span is now reachable, so unlike the previous line this range does
  # not deliberately place objects the arm has to refuse.
  lateral_offset_meters: [-0.42, 0.42]
  drop_height_meters: [0.01, 0.03]

arm:
  # A Universal Robots UR10e, adopted from MuJoCo Menagerie and vendored under
  # third_party/mujoco_menagerie_ur10e/. D-13 records why a validated model
  # derived from manufacturer CAD outranked the SCARA authored here, and what it
  # costs: the arm is slower, and two of its six axes go unused.
  #
  # Beside the belt, on a pedestal, not overhead. A six-axis arm inverted above
  # a plane is near-singular pointing straight down; a sweep with the tool held
  # vertical found 3 of 27 sample points reachable that way against full belt
  # coverage from the side.
  #
  # This is the top of the pedestal, which is the arm's own base. 0.70 m from
  # the centreline puts the whole 1.00 m belt inside the annulus below, with the
  # working range running 0.60 m to 0.75 m.
  base_position_meters: [0.0, -0.70, 0.90]
  # The pedestal's footprint. Its half-diagonal stays inside `reach_min_meters`,
  # so the arm cannot drive into the support carrying it.
  pedestal_footprint_meters: [0.30, 0.30]
  # The annulus the arm is trusted over, measured by sweeping the compiled model
  # with the tool held vertical rather than derived from link lengths: a
  # six-axis arm under an orientation constraint has no closed-form workspace.
  # The sweep put the inner limit at 0.200 m and the outer between 1.266 m and
  # 1.309 m by bearing; these sit inside both, so the trusted region is strictly
  # smaller than the reachable one. docs/measurements.md carries the sweep.
  reach_min_meters: 0.25
  reach_max_meters: 1.25
  # Where the flange is trusted, relative to the arm's own base rather than to
  # the belt, because that is the frame the sweep measured in. Solutions exist
  # well past both ends; these stop short on purpose.
  tool_above_base_meters: [-0.05, 0.45]
  # The widest object the end effector handles. The effector is specified
  # separately, so this bounds what the pick geometry assumes rather than what
  # any particular jaw can close on.
  max_grasp_width_meters: 0.180

bins:
  # One bin per distinct channel across the object set below.
  #
  # The offset is measured from the belt centreline, so it has to clear the
  # belt's half width. At 0.32 m it did on a 0.32 m belt and does not on a
  # 1.00 m one: the bins stood on the floor underneath the conveyor, which the
  # first regenerated still showed plainly. They now stand 0.25 m clear of the
  # belt edge, and are sized to read at a 3.00 m line rather than a 1.20 m one.
  spacing_meters: 0.34
  size_meters: [0.14, 0.14, 0.12]
  offset_from_belt_meters: 0.75

structure:
  # The belt and the arm used to float. Nothing below changes a trajectory: a
  # support is static geometry under equipment that already rested on nothing,
  # and the belt surface, the arm base and every measured quantity keep their
  # heights. It is here because a scene meant for an audience should look like
  # equipment rather than like floating boxes.
  #
  # Belt legs, as a bench conveyor has: four uprights under the frame.
  leg_side_meters: 0.025
  leg_inset_meters: 0.12
  # The frame the belt surface sits on, spanning the legs.
  frame_depth_meters: 0.05
  # The pedestal the manipulator is bolted to.
  # Narrow enough that the mounting plate clears the belt edge.
  pedestal_radius_meters: 0.045
  pedestal_plate_radius_meters: 0.055
  pedestal_plate_thickness_meters: 0.012

environment:
  # Scene dressing from the MIT-0 AWS RoboMaker warehouse, the same collection
  # FRET uses. It changes nothing the simulation measures: every prop is static
  # geometry placed clear of the belt and the workspace, and the overhead camera
  # the models see looks straight down at the belt.
  #
  # The meshes are generated by scripts/import_warehouse_assets.py and are not
  # committed. A world built without them keeps the plain floor and says so.
  #
  # Each prop names a mesh, where it stands, and how far it is turned. The
  # near props stand further out than they did on the 0.32 m belt: the channel
  # bins now sit 0.75 m from the centreline, and a prop at 0.95 m stood against
  # them rather than clear of the line.
  props:
    - mesh: shelf.obj
      position_meters: [-0.40, 2.30, 0.0]
      yaw_degrees: 0.0
    - mesh: shelf_e.obj
      position_meters: [-0.40, -2.40, 0.0]
      yaw_degrees: 180.0
    - mesh: trash_can.obj
      position_meters: [1.75, -1.50, 0.0]
      yaw_degrees: 25.0
    - mesh: pallet_jack.obj
      position_meters: [-2.00, -1.65, 0.0]
      yaw_degrees: 70.0
    - mesh: bucket.obj
      position_meters: [1.70, 1.60, 0.0]
      yaw_degrees: 0.0

# Every sensor that observes the belt. The tracker fuses by `role` and never
# by `id`, so adding, moving or removing a camera changes this list and nothing
# in clave.tracker. docs/architecture.md states that contract.
#
# All of them look straight down. A nadir view keeps the image plane parallel to
# the belt, so pixel to world is a scale factor rather than a homography that
# varies across the frame, an object's footprint in pixels is its footprint on
# the belt, and a barcode lies parallel to the sensor where it is most legible.
# Objects travel in a single layer, so nothing occludes anything from directly
# above. A tilt buys a little height information and costs all of that.
#
# The belt is centred on the origin and runs from x = -1.50 to +1.50, with
# travel towards +x, so the arm stands over the origin and the gate sits
# upstream of it at x = -1.00. An object is seen once,
# under controlled light, and is then carried to the arm by a belt whose speed
# is known, so the tracker propagates it by dead reckoning instead of
# re-detecting it every frame.
cameras:
  # Detection, classification and segmentation over the full belt width.
  # 1.252 m across at 0.652 mm per pixel, which resolves an object footprint
  # comfortably and a barcode not at all.
  - id: gate_wide
    role: detection
    position_meters: [-1.00, 0.0, 1.750]
    fovy_degrees: 45.0
    resolution: [1920, 1080]

  # Barcode reading. A 0.33 mm EAN-13 module needs roughly two pixels to
  # decode, so 0.165 mm per pixel is the floor, and the wide camera is four
  # times coarser than that. Three narrow-lens cameras tile the width at
  # 0.342 m each, giving 0.178 mm per pixel, or 1.9 pixels per module. That is
  # marginal by design: it is the cheapest arrangement that decodes at all, and
  # a line-scan camera is the alternative if it proves too tight.
  - id: gate_code_left
    role: code
    position_meters: [-1.00, 0.342, 1.630]
    fovy_degrees: 15.0
    resolution: [1920, 1080]
  - id: gate_code_center
    role: code
    position_meters: [-1.00, 0.0, 1.630]
    fovy_degrees: 15.0
    resolution: [1920, 1080]
  - id: gate_code_right
    role: code
    position_meters: [-1.00, -0.342, 1.630]
    fovy_degrees: 15.0
    resolution: [1920, 1080]

lighting:
  diffuse: [0.45, 0.80]

objects:
  # Every object is a scanned photograph of a real package. The parametric
  # cylinders and boxes this world used through v1.0.3 are gone: they taught a
  # classifier shape rather than material, which is the limitation v0.5.0
  # recorded and nothing had removed until now.
  #
  # What is here is what the gripper can close on. Measuring all 1,030 scanned
  # objects and both YCB collections found 276 under 52 mm across their
  # narrowest horizontal axis, and these are the ones among them that are
  # recyclable packaging rather than plant saucers, hard drives or toys.
  #
  # Two things a reader has to know.
  #
  # Four of the eleven taxonomy classes have an object. PET, PP, aluminum,
  # glass, corrugated board and beverage carton have none, because nothing made
  # of them in either collection fits a 55.7 mm gripper: a soda can is 66 mm, a
  # bleach bottle 68 mm, the narrowest cup 57 mm. `AC-ASSET-02` asks for six
  # classes and this set has four, which `D-09` records rather than hides.
  #
  # The material class is inferred from what the package is, not measured. A
  # supplement tub is taken as HDPE, a candy carton as paperboard, a tuna can
  # as steel. The synthetic set this replaces had its material true by
  # construction, so this is label noise the world did not have before, traded
  # for appearance it also did not have.

  # --- M-02, high-density polyethylene: supplement tubs and toiletry bottles ---

  # The pool fills its slots by walking this list in order, so the list order
  # decides which objects a short run ever spawns. Grouping the classes put
  # five HDPE tubs in the first five slots and left paperboard with one record
  # in twenty-four seeded runs. The classes alternate here for that reason, and
  # the comment is what keeps somebody from tidying them back into groups.

  - name: silicon_bottle
    material_class: M-02
    shape: mesh
    mesh: third_party/scanned_objects/models/JarroSil_Activated_Silicon/model.obj
    texture: third_party/scanned_objects/models/JarroSil_Activated_Silicon/texture.png
    density_kg_per_m3: [70, 130]

  - name: gelatin_box
    material_class: M-09
    shape: mesh
    mesh: third_party/ycb_sim/meshes/009_gelatin_box.msh
    texture: third_party/ycb_sim/textures/009_gelatin_box.png
    density_kg_per_m3: [90, 160]

  - name: snack_bags
    material_class: M-04
    shape: mesh
    mesh: third_party/scanned_objects/models/Now_Designs_Snack_Bags_Bicycle_2_count/model.obj
    texture: third_party/scanned_objects/models/Now_Designs_Snack_Bags_Bicycle_2_count/texture.png
    density_kg_per_m3: [40, 90]

  # The four YCB packages the 55.7 mm jaw excluded. What bounds an object now is
  # `arm.max_grasp_width_meters` at 0.180 m, and all four clear it. The master
  # chef can is 102.5 mm across and was the largest thing the old gripper
  # refused outright. The end effector is specified separately and is what will
  # set the next bound.
  - name: master_chef_can
    material_class: M-06
    shape: mesh
    mesh: third_party/ycb_sim/meshes/002_master_chef_can.msh
    texture: third_party/ycb_sim/textures/002_master_chef_can.png
    density_kg_per_m3: [180, 320]

  - name: tomato_soup_can
    material_class: M-06
    shape: mesh
    mesh: third_party/ycb_sim/meshes/005_tomato_soup_can.msh
    texture: third_party/ycb_sim/textures/005_tomato_soup_can.png
    density_kg_per_m3: [180, 320]

  - name: potted_meat_can
    material_class: M-06
    shape: mesh
    mesh: third_party/ycb_sim/meshes/010_potted_meat_can.msh
    texture: third_party/ycb_sim/textures/010_potted_meat_can.png
    density_kg_per_m3: [180, 320]

  # Taken as HDPE. A squeeze bottle of this shape is usually HDPE or LDPE, and
  # the label noise that inference carries is the trade D-09 already recorded.
  - name: mustard_bottle
    material_class: M-02
    shape: mesh
    mesh: third_party/ycb_sim/meshes/006_mustard_bottle.msh
    texture: third_party/ycb_sim/textures/006_mustard_bottle.png
    density_kg_per_m3: [80, 140]

  - name: tuna_fish_can
    material_class: M-06
    shape: mesh
    mesh: third_party/ycb_sim/meshes/007_tuna_fish_can.msh
    texture: third_party/ycb_sim/textures/007_tuna_fish_can.png
    density_kg_per_m3: [180, 320]

  # --- M-09, paperboard: the cartons a kitchen produces most of ---

  - name: coq10_tub
    material_class: M-02
    shape: mesh
    mesh: third_party/scanned_objects/models/CoQ10/model.obj
    texture: third_party/scanned_objects/models/CoQ10/texture.png
    density_kg_per_m3: [70, 130]

  - name: pudding_box
    material_class: M-09
    shape: mesh
    mesh: third_party/ycb_sim/meshes/008_pudding_box.msh
    texture: third_party/ycb_sim/textures/008_pudding_box.png
    density_kg_per_m3: [90, 160]

  - name: sprinkles_jar
    material_class: M-04
    shape: mesh
    mesh: third_party/scanned_objects/models/Wilton_Pearlized_Sugar_Sprinkles_525_oz_Gold/model.obj
    texture: third_party/scanned_objects/models/Wilton_Pearlized_Sugar_Sprinkles_525_oz_Gold/texture.png
    density_kg_per_m3: [70, 130]

  # --- M-06, ferrous metal ---

  - name: candy_carton
    material_class: M-09
    shape: mesh
    mesh: third_party/scanned_objects/models/Nestle_Candy_19_oz_Butterfinger_Singles_116567/model.obj
    texture: third_party/scanned_objects/models/Nestle_Candy_19_oz_Butterfinger_Singles_116567/texture.png
    density_kg_per_m3: [90, 160]

  - name: folic_acid_tub
    material_class: M-02
    shape: mesh
    mesh: third_party/scanned_objects/models/Folic_Acid/model.obj
    texture: third_party/scanned_objects/models/Folic_Acid/texture.png
    density_kg_per_m3: [70, 130]

  - name: sugar_box
    material_class: M-09
    shape: mesh
    mesh: third_party/ycb_sim/meshes/004_sugar_box.msh
    texture: third_party/ycb_sim/textures/004_sugar_box.png
    density_kg_per_m3: [90, 160]

  - name: haircolor_bottle
    material_class: M-02
    shape: mesh
    mesh: third_party/scanned_objects/models/Just_For_Men_Shampoo_In_Haircolor_Darkest_Brown_50/model.obj
    texture: third_party/scanned_objects/models/Just_For_Men_Shampoo_In_Haircolor_Darkest_Brown_50/texture.png
    density_kg_per_m3: [80, 140]

  - name: donut_carton
    material_class: M-09
    shape: mesh
    mesh: third_party/scanned_objects/models/Little_Debbie_Donut_Sticks_6_cake_donuts_10_oz_total/model.obj
    texture: third_party/scanned_objects/models/Little_Debbie_Donut_Sticks_6_cake_donuts_10_oz_total/texture.png
    density_kg_per_m3: [90, 160]

  - name: caplet_tub
    material_class: M-02
    shape: mesh
    mesh: third_party/scanned_objects/models/Phillips_Caplets_Size_24/model.obj
    texture: third_party/scanned_objects/models/Phillips_Caplets_Size_24/texture.png
    density_kg_per_m3: [70, 130]

  # --- M-04, plastics outside codes 1, 2 and 5, including film ---

  - name: coffee_carton
    material_class: M-09
    shape: mesh
    mesh: third_party/scanned_objects/models/NESCAFE_NESCAFE_TC_STKS_DECAF_6_CT/model.obj
    texture: third_party/scanned_objects/models/NESCAFE_NESCAFE_TC_STKS_DECAF_6_CT/texture.png
    density_kg_per_m3: [90, 160]
