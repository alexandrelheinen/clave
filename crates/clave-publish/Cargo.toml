[package]
name = "clave-publish"
description = "Delivers encoded pick decisions to one consumer under a bounded, counted overflow policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The in-memory sink the conformance suite and the property tests run against.
# It is not part of a production build, so it stays off by default.
test-support = []

[dependencies]
clave-decision.workspace = true
thiserror.workspace = true

[dev-dependencies]
clave-publish = { path = ".", features = ["test-support"] }
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "publish"
harness = false

# Cargo refuses to merge an inherited lint table with a local one, so this
# crate repeats the workspace baseline beside the hardened tier it needs. The
# two tiers are defined in .guidelines/languages/rs.md.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"
float_cmp = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "deny"
as_conversions = "deny"
indexing_slicing = "deny"
integer_division = "deny"
modulo_arithmetic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
large_stack_arrays = "deny"
string_slice = "deny"
exit = "deny"
