[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clave"
version = "0.3.0"
description = "Learning platform for CLAVE: corpus manifests, run records, and reproducibility"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# PyTorch is the framework selected at v0.1.0. Nothing under src/clave imports
# it: the core stays framework-free so it is testable without a heavy install.
# v0.7.0 is the step that takes this dependency for real.
torch = ["torch>=2.2"]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.9", "ruff>=0.4"]

[project.scripts]
clave = "clave.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clave"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["clave"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# torch is an optional extra that the core never imports at module scope. The
# one conditional import in clave.experiment.seeding exists so a machine with
# torch installed gets it seeded; a machine without it must still type-check.
[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/clave"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
