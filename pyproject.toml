[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clave"
version = "0.3.0"
description = "Learning platform for CLAVE: corpus manifests, run records, and reproducibility"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
# PyTorch is the framework selected at v0.1.0. Nothing under src/clave imports
# it: the core stays framework-free so it is testable without a heavy install.
# v0.7.0 is the step that takes this dependency for real.
torch = ["torch>=2.2", "torchvision>=0.17"]
# Candidate libraries, needed only to run `clave bench-candidates`. The gate
# does not install them: the registry is readable without them and the
# candidate tests skip when they are absent.
candidates = [
    "torch>=2.2",
    "torchvision>=0.17",
    "lerobot>=0.6",
    "diffusers>=0.27",
    "stable-baselines3>=2.3",
    "gymnasium>=1.0",
]
world = ["mujoco>=3.2", "pyyaml>=6"]
# Publishing the decision on ROS 2. rclpy and the message packages come from a
# ROS installation rather than from a wheel, which is why only the CBOR decoder
# is listed here.
ros = ["cbor2>=5.6"]
# cbor2 belongs to the ros extra and is repeated here on purpose: the decoder
# that reads the published contract is core enough to test on every run, and the
# gate installs no ROS distribution, so this is the only way it gets exercised.
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.9", "ruff>=0.4", "cbor2>=5.6"]

[project.scripts]
clave = "clave.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clave"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["clave"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# torch is an optional extra that the core never imports at module scope. The
# one conditional import in clave.experiment.seeding exists so a machine with
# torch installed gets it seeded; a machine without it must still type-check.
# These libraries ship no type stubs and no py.typed marker. They are optional
# extras imported lazily inside adapter builders, so the core type-checks on a
# machine where none of them is installed.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "sam2.*",
    "lerobot.*",
    "stable_baselines3.*",
    "gymnasium.*",
    "diffusers.*",
    "mujoco.*",
    "yaml",
    "cbor2",
    # ROS 2 ships rclpy and its message packages through a system installation
    # rather than a wheel, so they are absent from the gate's environment and
    # from any machine that has not sourced a distribution.
    "rclpy.*",
    "vision_msgs.*",
    "geometry_msgs.*",
    "std_msgs.*",
]
ignore_missing_imports = true

# The behavior cloning baseline subclasses torch.nn.Module inside a builder. On
# a machine with torch installed mypy resolves that base class; on the gate,
# where torch is deliberately absent, it resolves to Any and strict mode refuses
# the subclass. The check is disabled for that one module so the same source
# type-checks in both environments.
[[tool.mypy.overrides]]
module = ["clave.candidates.policy"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/clave"]
branch = true
# The candidate adapters are three-line shims calling upstream constructors, and
# they cannot execute without multi-gigabyte optional libraries the gate does
# not install. Their real test is the benchmark sweep, whose committed output is
# docs/research/model-candidates.md. Recorded in docs/decisions.md.
omit = ["src/clave/candidates/perception.py", "src/clave/candidates/policy.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
